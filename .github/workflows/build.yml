name: Build WaterDroplets APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MainHook.kt'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/waterdrop/module
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

      - name: Copy MainHook.kt
        run: |
          if [ ! -f "MainHook.kt" ]; then
            echo "❌ ERROR: MainHook.kt not found in root directory!"
            exit 1
          fi
          cp MainHook.kt app/src/main/java/com/waterdrop/module/MainHook.kt
          echo "✅ MainHook.kt copied successfully"

      - name: Setup Gradle Wrapper
        run: |
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          curl -L -o gradle/wrapper/gradle-wrapper.jar "https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
          
          echo '#!/bin/sh' > gradlew
          echo 'exec java -classpath "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
          chmod +x gradlew

      - name: Create Root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

      - name: Create settings.gradle (FIXED: Added JitPack)
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' } // <-- این خط اضافه شد تا Xposed API پیدا شود
              }
          }
          rootProject.name = "WaterDroplets"
          include ':app'
          EOF

      - name: Create gradle.properties
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.waterdrop.module'
              compileSdk 34

              defaultConfig {
                  applicationId "com.waterdrop.module"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
              compileOnly 'de.robv.android.xposed:api:82:sources'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application android:label="Water Droplets" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Water Droplets on Lock Screen" />
                  <meta-data android:name="xposedminversion" android:value="93" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposed_scope" />
              </application>
          </manifest>
          EOF

      - name: Create xposed_init
        run: echo "com.waterdrop.module.MainHook" > app/src/main/assets/xposed_init

      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Water Droplets</string>
              <string-array name="xposed_scope">
                  <item>com.android.systemui</item>
              </string-array>
          </resources>
          EOF

      - name: Create MainActivity.kt
        run: |
          cat > app/src/main/java/com/waterdrop/module/MainActivity.kt << 'EOF'
          package com.waterdrop.module
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "Module Installed ✅\nEnable SystemUI in LSPosed"
                  tv.textSize = 18f
                  tv.setPadding(50, 50, 50, 50)
                  setContentView(tv)
              }
          }
          EOF

      - name: Create WaterDropOverlay.kt
        run: |
          cat > app/src/main/java/com/waterdrop/module/WaterDropOverlay.kt << 'EOF'
          package com.waterdrop.module
          import android.content.Context
          import android.graphics.*
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import kotlin.math.sin
          import kotlin.random.Random

          class WaterDropOverlay(context: Context) : View(context) {
              private val droplets = mutableListOf<Droplet>()
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val highlightPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val handler = Handler(Looper.getMainLooper())
              private val random = Random(System.currentTimeMillis())

              init {
                  setBackgroundColor(Color.TRANSPARENT)
                  setWillNotDraw(false)
                  paint.style = Paint.Style.FILL
                  paint.color = Color.argb(60, 200, 230, 255)
                  highlightPaint.style = Paint.Style.FILL
                  highlightPaint.color = Color.argb(200, 255, 255, 255)
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  droplets.clear()
                  repeat(100) {
                      droplets.add(Droplet(
                          x = random.nextFloat() * w,
                          y = random.nextFloat() * h,
                          radius = random.nextFloat() * 8f + 4f,
                          speed = random.nextFloat() * 1.5f + 0.5f
                      ))
                  }
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  droplets.forEach { d ->
                      paint.alpha = (0.4f * 255).toInt()
                      canvas.drawCircle(d.x, d.y, d.radius, paint)
                      highlightPaint.alpha = 180
                      canvas.drawCircle(d.x - d.radius * 0.3f, d.y - d.radius * 0.3f, d.radius * 0.25f, highlightPaint)
                  }
              }

              fun startAnimation() {
                  handler.post(object : Runnable {
                      override fun run() {
                          try {
                              val h = height.toFloat()
                              val w = width.toFloat()
                              droplets.forEach { d ->
                                  d.y += d.speed
                                  d.x += sin(d.y * 0.02f).toFloat() * 0.5f
                                  if (d.y - d.radius > h) {
                                      d.y = -d.radius
                                      d.x = random.nextFloat() * w
                                  }
                              }
                              invalidate()
                              handler.postDelayed(this, 16)
                          } catch (e: Exception) {
                              handler.removeCallbacksAndMessages(null)
                          }
                      }
                  })
              }
          }
          data class Droplet(var x: Float, var y: Float, val radius: Float, var speed: Float)
          EOF

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaterDroplets-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
